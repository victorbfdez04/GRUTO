<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRUTO | Gastos compartidos</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f2f5f8;
            color: #142d45;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #142d45;
            color: white;
            padding: 22px 8%;
            font-size: 26px;
            font-weight: bold;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .welcome {
            background: white;
            max-width: 650px;
            width: 100%;
            padding: 55px 35px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 8px 30px #142d4515;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        p {
            color: #64748b;
            line-height: 1.6;
        }

        .tag {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            border-radius: 8px;
            background: #142d45;
            color: white;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #64748b;
        }
    </style>
</head>
<body>

<header>GRUTO</header>

<main>
    <section class="welcome">
        <h1>¡Bienvenido a GRUTO!</h1>
        <p><strong>Los gastos, en grupo.</strong></p>
        <p>
            Estamos preparando una forma más sencilla
            de organizar y compartir gastos.
        </p>
        <span class="tag">Próximamente</span>
    </section>
</main>

<footer>
    GRUTO · Gestión de gastos compartidos
</footer>

</body>
</html>
